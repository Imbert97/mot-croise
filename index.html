<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance — Mattias</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"><\/script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg-primary: #0d0d12;
            --bg-secondary: #13131c;
            --bg-card: #191924;
            --bg-hover: #20202e;
            --accent: #7c6fff;
            --accent-light: #9d94ff;
            --green: #00d4aa;
            --red: #ff4d6a;
            --text-primary: #f0f0ff;
            --text-secondary: #8080a0;
            --text-muted: #50506a;
            --border: #252535;
            --border-light: #303048;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; }

        /* NAV */
        .nav { display:flex; align-items:center; padding:0 32px; height:64px; background:var(--bg-secondary); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:100; gap:40px; }
        .nav-brand { font-size:18px; font-weight:800; letter-spacing:-0.5px; background:linear-gradient(135deg,#9d94ff,#00d4aa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .nav-tabs { display:flex; gap:4px; background:var(--bg-primary); padding:4px; border-radius:10px; }
        .nav-tab { padding:8px 22px; border-radius:8px; cursor:pointer; font-size:14px; font-weight:600; color:var(--text-secondary); transition:all 0.2s; border:none; background:transparent; letter-spacing:0.2px; }
        .nav-tab:hover { color:var(--text-primary); }
        .nav-tab.active { background:var(--bg-card); color:var(--text-primary); box-shadow:0 2px 8px rgba(0,0,0,0.4); }
        .nav-date { margin-left:auto; font-size:13px; color:var(--text-muted); font-weight:500; }

        /* PAGES */
        .page { display:none; padding:28px 32px; max-width:1280px; margin:0 auto; }
        .page.active { display:block; }

        /* CARDS */
        .card { background:var(--bg-card); border:1px solid var(--border); border-radius:20px; padding:28px; }

        /* MAIN PORTFOLIO CARD */
        .portfolio-top { display:grid; grid-template-columns:1fr auto; align-items:start; margin-bottom:28px; gap:24px; }
        .pf-label { font-size:12px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; }
        .pf-value { font-size:52px; font-weight:800; letter-spacing:-2.5px; line-height:1; }
        .pf-change { display:flex; align-items:center; gap:10px; margin-top:10px; font-size:15px; font-weight:600; }
        .pf-change.pos { color:var(--green); }
        .pf-change.neg { color:var(--red); }
        .badge { padding:4px 10px; border-radius:20px; font-size:12px; font-weight:700; }
        .badge-g { background:rgba(0,212,170,0.12); color:var(--green); border:1px solid rgba(0,212,170,0.2); }
        .badge-r { background:rgba(255,77,106,0.12); color:var(--red); border:1px solid rgba(255,77,106,0.2); }
        .pf-period-lbl { color:var(--text-muted); font-size:13px; font-weight:400; }
        .pf-right { text-align:right; display:flex; flex-direction:column; gap:12px; }
        .pf-stat { }
        .pf-stat-lbl { font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.8px; margin-bottom:4px; }
        .pf-stat-val { font-size:22px; font-weight:700; letter-spacing:-0.5px; }

        /* PERIOD SELECTOR */
        .period-sel { display:flex; gap:4px; margin-bottom:20px; background:var(--bg-primary); padding:4px; border-radius:10px; width:fit-content; }
        .period-btn { padding:8px 18px; border-radius:7px; cursor:pointer; font-size:13px; font-weight:700; color:var(--text-secondary); transition:all 0.2s; border:none; background:transparent; letter-spacing:0.3px; }
        .period-btn:hover { color:var(--text-primary); }
        .period-btn.active { background:var(--bg-card); color:var(--text-primary); box-shadow:0 2px 8px rgba(0,0,0,0.4); }

        /* CHART */
        .chart-wrap { position:relative; height:240px; }

        /* STATS ROW */
        .stats-row { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin:20px 0; }
        .stat-card { background:var(--bg-card); border:1px solid var(--border); border-radius:16px; padding:20px 22px; }
        .stat-lbl { font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.8px; margin-bottom:8px; }
        .stat-val { font-size:26px; font-weight:800; letter-spacing:-0.5px; }
        .stat-sub { font-size:13px; color:var(--text-secondary); margin-top:4px; }

        /* SECTION HEADER */
        .sec-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
        .sec-title { font-size:18px; font-weight:800; letter-spacing:-0.3px; }
        .btn-add { display:flex; align-items:center; gap:8px; padding:10px 22px; background:var(--accent); color:white; border:none; border-radius:10px; font-size:14px; font-weight:700; cursor:pointer; transition:all 0.2s; font-family:'Inter',sans-serif; }
        .btn-add:hover { background:var(--accent-light); transform:translateY(-1px); box-shadow:0 4px 20px rgba(124,111,255,0.3); }

        /* TABLE */
        .htable { width:100%; border-collapse:collapse; }
        .htable th { text-align:left; padding:10px 16px; font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.8px; border-bottom:1px solid var(--border); }
        .htable td { padding:14px 16px; border-bottom:1px solid var(--border); font-size:14px; transition:background 0.15s; }
        .htable tr:last-child td { border-bottom:none; }
        .htable tbody tr:hover td { background:var(--bg-hover); }
        .asset-wrap { display:flex; align-items:center; gap:14px; }
        .asset-icon { width:42px; height:42px; border-radius:13px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:white; letter-spacing:0.5px; flex-shrink:0; }
        .asset-name { font-weight:700; font-size:14px; }
        .asset-full { font-size:12px; color:var(--text-muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:200px; }
        .tr { text-align:right; }
        .fw { font-weight:700; }
        .tg { color:var(--green); }
        .tr2 { color:var(--red); }
        .btn-del { width:32px; height:32px; border-radius:8px; border:none; background:transparent; color:var(--text-muted); cursor:pointer; font-size:15px; display:inline-flex; align-items:center; justify-content:center; transition:all 0.2s; }
        .btn-del:hover { background:rgba(255,77,106,0.12); color:var(--red); }

        /* MODAL */
        .modal-ov { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); backdrop-filter:blur(6px); z-index:200; align-items:center; justify-content:center; }
        .modal-ov.on { display:flex; }
        .modal { background:var(--bg-card); border:1px solid var(--border-light); border-radius:24px; padding:32px; width:100%; max-width:500px; animation:slideUp 0.25s ease; }
        @keyframes slideUp { from{transform:translateY(16px);opacity:0} to{transform:translateY(0);opacity:1} }
        .modal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; }
        .modal-title { font-size:22px; font-weight:800; letter-spacing:-0.5px; }
        .modal-close { width:34px; height:34px; border-radius:10px; border:none; background:var(--bg-secondary); color:var(--text-secondary); cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; transition:all 0.2s; }
        .modal-close:hover { background:var(--bg-hover); color:var(--text-primary); }
        .fg { margin-bottom:18px; }
        .flbl { display:block; font-size:12px; font-weight:700; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.8px; margin-bottom:8px; }
        .finp { width:100%; padding:12px 16px; background:var(--bg-secondary); border:1px solid var(--border); border-radius:12px; color:var(--text-primary); font-size:15px; font-family:'Inter',sans-serif; transition:border-color 0.2s; }
        .finp:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(124,111,255,0.1); }
        .finp::placeholder { color:var(--text-muted); }
        .frow { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
        .btn-sub { width:100%; padding:14px; background:linear-gradient(135deg,#7c6fff,#9d94ff); color:white; border:none; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; transition:all 0.2s; margin-top:8px; font-family:'Inter',sans-serif; letter-spacing:0.2px; }
        .btn-sub:hover { transform:translateY(-1px); box-shadow:0 6px 24px rgba(124,111,255,0.35); }

        /* BUDGET PLACEHOLDER */
        .coming { display:flex; flex-direction:column; align-items:center; justify-content:center; height:65vh; gap:16px; }
        .coming-icon { font-size:72px; opacity:0.15; }
        .coming h2 { font-size:26px; font-weight:800; color:var(--text-secondary); }
        .coming p { color:var(--text-muted); font-size:15px; }

        /* MISC */
        .text-g { color:var(--green); }
        .text-r { color:var(--red); }
        ::-webkit-scrollbar { width:5px; }
        ::-webkit-scrollbar-track { background:var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background:var(--border-light); border-radius:3px; }
    </style>
</head>
<body>

<nav class="nav">
    <div class="nav-brand">◈ Finance</div>
    <div class="nav-tabs">
        <button class="nav-tab active" onclick="switchPage('placements',this)">📈 Placements</button>
        <button class="nav-tab" onclick="switchPage('budget',this)">💳 Budget</button>
    </div>
    <div class="nav-date" id="nav-date"></div>
</nav>

<!-- =================== PLACEMENTS =================== -->
<div class="page active" id="page-placements">

    <!-- Main chart card -->
    <div class="card" style="margin-bottom:20px">
        <div class="portfolio-top">
            <div>
                <div class="pf-label">Valeur totale du portefeuille</div>
                <div class="pf-value" id="total-value">—</div>
                <div class="pf-change pos" id="pf-change">
                    <span id="chg-amt">—</span>
                    <span class="badge badge-g" id="chg-pct">—</span>
                    <span class="pf-period-lbl" id="chg-lbl">Aujourd'hui</span>
                </div>
            </div>
            <div class="pf-right">
                <div class="pf-stat">
                    <div class="pf-stat-lbl">Coût total</div>
                    <div class="pf-stat-val" id="total-cost">—</div>
                </div>
                <div class="pf-stat">
                    <div class="pf-stat-lbl">Gain total</div>
                    <div class="pf-stat-val text-g" id="total-gain">—</div>
                </div>
            </div>
        </div>

        <div class="period-sel">
            <button class="period-btn active" onclick="setPeriod('1J',this)">1J</button>
            <button class="period-btn" onclick="setPeriod('1S',this)">1S</button>
            <button class="period-btn" onclick="setPeriod('1M',this)">1M</button>
            <button class="period-btn" onclick="setPeriod('1A',this)">1A</button>
            <button class="period-btn" onclick="setPeriod('Tout',this)">Tout</button>
        </div>

        <div class="chart-wrap">
            <canvas id="pfChart"></canvas>
        </div>
    </div>

    <!-- Stats row -->
    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-lbl">Positions</div>
            <div class="stat-val" id="st-pos">—</div>
            <div class="stat-sub">actifs détenus</div>
        </div>
        <div class="stat-card">
            <div class="stat-lbl">Rendement global</div>
            <div class="stat-val text-g" id="st-ret">—</div>
            <div class="stat-sub">depuis le début</div>
        </div>
        <div class="stat-card">
            <div class="stat-lbl">Meilleure position</div>
            <div class="stat-val" id="st-best">—</div>
            <div class="stat-sub text-g" id="st-best-g">—</div>
        </div>
    </div>

    <!-- Holdings table -->
    <div class="card">
        <div class="sec-head">
            <div class="sec-title">Positions</div>
            <button class="btn-add" onclick="openModal()">＋ Ajouter une position</button>
        </div>
        <table class="htable">
            <thead>
                <tr>
                    <th>Actif</th>
                    <th class="tr">Qté</th>
                    <th class="tr">Prix moy.</th>
                    <th class="tr">Prix act.</th>
                    <th class="tr">Valeur</th>
                    <th class="tr">Gain / Perte</th>
                    <th class="tr">Rendement</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="htbody"></tbody>
        </table>
    </div>
</div>

<!-- =================== BUDGET =================== -->
<div class="page" id="page-budget">
    <div class="coming">
        <div class="coming-icon">💳</div>
        <h2>Page Budget</h2>
        <p>Cette section sera développée dans la prochaine étape.</p>
    </div>
</div>

<!-- =================== MODAL =================== -->
<div class="modal-ov" id="modal">
    <div class="modal">
        <div class="modal-head">
            <div class="modal-title">Nouvelle position</div>
            <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="fg">
            <label class="flbl">Nom complet de l'actif</label>
            <input type="text" class="finp" id="in-name" placeholder="ex: Vanguard All-Equity ETF Portfolio">
        </div>
        <div class="frow">
            <div class="fg">
                <label class="flbl">Symbole (Ticker)</label>
                <input type="text" class="finp" id="in-ticker" placeholder="ex: VEQT">
            </div>
            <div class="fg">
                <label class="flbl">Bourse</label>
                <input type="text" class="finp" id="in-exchange" placeholder="ex: TSX">
            </div>
        </div>
        <div class="frow">
            <div class="fg">
                <label class="flbl">Nombre d'actions</label>
                <input type="number" class="finp" id="in-shares" placeholder="108" step="0.001">
            </div>
            <div class="fg">
                <label class="flbl">Prix d'achat moyen ($)</label>
                <input type="number" class="finp" id="in-avg" placeholder="44.01" step="0.01">
            </div>
        </div>
        <div class="fg">
            <label class="flbl">Prix actuel ($)</label>
            <input type="number" class="finp" id="in-price" placeholder="44.50" step="0.01">
        </div>
        <div class="fg">
            <label class="flbl">Date d'achat (optionnel)</label>
            <input type="date" class="finp" id="in-date">
        </div>
        <button class="btn-sub" onclick="addHolding()">Ajouter au portefeuille</button>
    </div>
</div>

<script>
// ─── DATA ────────────────────────────────────────────────────
let holdings = [
    { id:1, name:"Vanguard All-Equity ETF Portfolio", ticker:"VEQT", exchange:"TSX", shares:108, avgPrice:44.01, currentPrice:44.50, date:"2024-01-15", color:"#7c6fff" }
];
let currentPeriod = "1J";
let chart = null;

// ─── UTILS ───────────────────────────────────────────────────
const fCAD = v => v.toLocaleString("fr-CA",{style:"currency",currency:"CAD",minimumFractionDigits:2});
const fPct = v => (v>=0?"+":"")+v.toFixed(2)+"%";

function seededRand(seed) {
    let s = seed;
    return function() { s=(s*9301+49297)%233280; return s/233280; };
}

function genData(period) {
    const base = getTotalValue();
    const rng = seededRand(42 + period.length * 7);
    let labels=[], data=[];
    const jitter = (v, pct) => v + (rng()-0.5)*2*v*pct;

    if(period==="1J"){
        const hrs=["9h00","9h30","10h","10h30","11h","11h30","12h","12h30","13h","13h30","14h","14h30","15h","15h30","16h"];
        hrs.forEach((h,i)=>{ labels.push(h); data.push(+(base*(0.988+i/hrs.length*0.012)+jitter(base,0.003)).toFixed(2)); });
    } else if(period==="1S"){
        ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"].forEach((d,i)=>{
            labels.push(d); data.push(+(base*(0.978+i/6*0.022)+jitter(base,0.005)).toFixed(2));
        });
    } else if(period==="1M"){
        for(let i=30;i>=0;i--){
            const d=new Date(); d.setDate(d.getDate()-i);
            labels.push(`${d.getDate()}/${d.getMonth()+1}`);
            data.push(+(base*(0.945+(30-i)/30*0.055)+jitter(base,0.008)).toFixed(2));
        }
    } else if(period==="1A"){
        const ms=["Jan","Fév","Mar","Avr","Mai","Jun","Jul","Aoû","Sep","Oct","Nov","Déc"];
        for(let i=11;i>=0;i--){
            const d=new Date(); d.setMonth(d.getMonth()-i);
            labels.push(ms[d.getMonth()]); data.push(+(base*(0.88+(11-i)/11*0.12)+jitter(base,0.015)).toFixed(2));
        }
    } else {
        for(let y=2022;y<=2026;y++){
            for(let q=1;q<=4;q++){
                if(y===2026&&q>1) break;
                labels.push(`Q${q} ${y}`);
                const prog=((y-2022)*4+q-1)/13;
                data.push(+(base*(0.65+prog*0.35)+jitter(base,0.02)).toFixed(2));
            }
        }
    }
    data[data.length-1]=+base.toFixed(2);
    return {labels,data};
}

// ─── CALCULATIONS ────────────────────────────────────────────
const getTotalValue = () => holdings.reduce((s,h)=>s+h.shares*h.currentPrice,0);
const getTotalCost  = () => holdings.reduce((s,h)=>s+h.shares*h.avgPrice,0);
const getTotalGain  = () => getTotalValue()-getTotalCost();

// ─── REFRESH ─────────────────────────────────────────────────
function refresh() {
    const val=getTotalValue(), cost=getTotalCost(), gain=getTotalGain();
    const gainPct=(gain/cost)*100;

    document.getElementById("total-value").textContent=fCAD(val);
    document.getElementById("total-cost").textContent=fCAD(cost);
    const gEl=document.getElementById("total-gain");
    gEl.textContent=(gain>=0?"+":"")+fCAD(gain);
    gEl.className="pf-stat-val "+(gain>=0?"text-g":"text-r");

    const periodPct={"1J":0.22,"1S":1.15,"1M":2.47,"1A":8.32,"Tout":gainPct};
    const periodLbls={"1J":"Aujourd'hui","1S":"Cette semaine","1M":"Ce mois","1A":"Cette année","Tout":"Depuis le début"};
    const pct=periodPct[currentPeriod];
    const amt=val*pct/100;
    const pfC=document.getElementById("pf-change");
    pfC.className="pf-change "+(pct>=0?"pos":"neg");
    document.getElementById("chg-amt").textContent=(pct>=0?"+":"")+fCAD(amt);
    const pctBadge=document.getElementById("chg-pct");
    pctBadge.textContent=fPct(pct);
    pctBadge.className="badge "+(pct>=0?"badge-g":"badge-r");
    document.getElementById("chg-lbl").textContent=periodLbls[currentPeriod];

    document.getElementById("st-pos").textContent=holdings.length;
    const retEl=document.getElementById("st-ret");
    retEl.textContent=fPct(gainPct);
    retEl.className="stat-val "+(gainPct>=0?"text-g":"text-r");

    if(holdings.length>0){
        const best=[...holdings].sort((a,b)=>{
            return ((b.currentPrice-b.avgPrice)/b.avgPrice)-((a.currentPrice-a.avgPrice)/a.avgPrice);
        })[0];
        const bp=(best.currentPrice-best.avgPrice)/best.avgPrice*100;
        document.getElementById("st-best").textContent=best.ticker;
        const bgEl=document.getElementById("st-best-g");
        bgEl.textContent=fPct(bp);
        bgEl.className="stat-sub "+(bp>=0?"text-g":"text-r");
    }

    renderTable();
    updateChart();
    document.getElementById("nav-date").textContent=new Date().toLocaleDateString("fr-CA",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
}

// ─── TABLE ───────────────────────────────────────────────────
function renderTable(){
    const tb=document.getElementById("htbody");
    tb.innerHTML="";
    holdings.forEach(h=>{
        const val=h.shares*h.currentPrice, cost=h.shares*h.avgPrice;
        const gain=val-cost, pct=(gain/cost)*100;
        const gc=gain>=0?"tg":"tr2";
        const bc=gain>=0?"badge-g":"badge-r";
        const init=h.ticker.slice(0,4);
        const tr=document.createElement("tr");
        tr.innerHTML=`
            <td><div class="asset-wrap">
                <div class="asset-icon" style="background:linear-gradient(135deg,${h.color},${h.color}88)">${init}</div>
                <div><div class="asset-name">${h.ticker} <span style="font-size:11px;color:var(--text-muted);font-weight:500">${h.exchange||""}</span></div>
                <div class="asset-full">${h.name}</div></div>
            </div></td>
            <td class="tr fw">${h.shares.toLocaleString("fr-CA")}</td>
            <td class="tr">${fCAD(h.avgPrice)}</td>
            <td class="tr fw">${fCAD(h.currentPrice)}</td>
            <td class="tr fw">${fCAD(val)}</td>
            <td class="tr fw ${gc}">${gain>=0?"+":""}${fCAD(gain)}</td>
            <td class="tr"><span class="badge ${bc}">${fPct(pct)}</span></td>
            <td class="tr"><button class="btn-del" onclick="delHolding(${h.id})" title="Supprimer">🗑</button></td>`;
        tb.appendChild(tr);
    });
}

// ─── CHART ───────────────────────────────────────────────────
function updateChart(){
    const {labels,data}=genData(currentPeriod);
    const up=data[data.length-1]>=data[0];
    const col=up?"#00d4aa":"#ff4d6a";
    if(chart){
        chart.data.labels=labels;
        chart.data.datasets[0].data=data;
        chart.data.datasets[0].borderColor=col;
        chart.data.datasets[0].backgroundColor=col+"18";
        chart.update("active");
    } else {
        const ctx=document.getElementById("pfChart").getContext("2d");
        chart=new Chart(ctx,{
            type:"line",
            data:{labels,datasets:[{data,borderColor:col,backgroundColor:col+"18",borderWidth:2.5,fill:true,tension:0.4,pointRadius:0,pointHoverRadius:6,pointHoverBackgroundColor:col,pointHoverBorderColor:"#fff",pointHoverBorderWidth:2}]},
            options:{
                responsive:true,maintainAspectRatio:false,
                plugins:{
                    legend:{display:false},
                    tooltip:{backgroundColor:"#191924",borderColor:"#252535",borderWidth:1,titleColor:"#8080a0",bodyColor:"#f0f0ff",bodyFont:{size:15,weight:"700",family:"Inter"},padding:12,displayColors:false,
                        callbacks:{label:c=>fCAD(c.raw)}}
                },
                scales:{
                    x:{grid:{display:false},border:{display:false},ticks:{color:"#50506a",font:{size:11,family:"Inter"}}},
                    y:{position:"right",grid:{color:"#191924"},border:{display:false},ticks:{color:"#50506a",font:{size:11,family:"Inter"},callback:v=>fCAD(v)}}
                },
                interaction:{mode:"index",intersect:false}
            }
        });
    }
}

// ─── ACTIONS ─────────────────────────────────────────────────
function setPeriod(p,btn){
    currentPeriod=p;
    document.querySelectorAll(".period-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    refresh();
}
function switchPage(p,btn){
    document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
    document.querySelectorAll(".nav-tab").forEach(x=>x.classList.remove("active"));
    document.getElementById("page-"+p).classList.add("active");
    btn.classList.add("active");
}
function openModal(){document.getElementById("modal").classList.add("on");}
function closeModal(){
    document.getElementById("modal").classList.remove("on");
    ["in-name","in-ticker","in-exchange","in-shares","in-avg","in-price","in-date"].forEach(id=>{document.getElementById(id).value="";});
}
function addHolding(){
    const name=document.getElementById("in-name").value.trim();
    const ticker=document.getElementById("in-ticker").value.trim().toUpperCase();
    const exchange=document.getElementById("in-exchange").value.trim().toUpperCase();
    const shares=parseFloat(document.getElementById("in-shares").value);
    const avg=parseFloat(document.getElementById("in-avg").value);
    const price=parseFloat(document.getElementById("in-price").value);
    const date=document.getElementById("in-date").value;
    if(!name||!ticker||isNaN(shares)||isNaN(avg)||isNaN(price)){alert("Veuillez remplir tous les champs obligatoires.");return;}
    const palette=["#7c6fff","#00d4aa","#f59e0b","#ef4444","#3b82f6","#8b5cf6","#ec4899","#14b8a6"];
    holdings.push({id:Date.now(),name,ticker,exchange,shares,avgPrice:avg,currentPrice:price,date,color:palette[holdings.length%palette.length]});
    closeModal(); refresh();
}
function delHolding(id){
    if(confirm("Supprimer cette position du portefeuille ?")){holdings=holdings.filter(h=>h.id!==id);refresh();}
}
document.getElementById("modal").addEventListener("click",e=>{if(e.target===document.getElementById("modal"))closeModal();});

// ─── INIT ────────────────────────────────────────────────────
refresh();
<\/script>
</body>
